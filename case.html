<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>시공사례</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="index.html" class="logo" data-bind="name"></a>
      <nav class="nav-links">
        <a href="works.html">시공사례</a>
        <a href="index.html#services">서비스</a>
        <a href="index.html#process">진행과정</a>
        <a href="index.html#contact" class="btn btn-sm">무료 상담</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section page-top">
      <div class="wrap">
        <a href="works.html" class="back-link">← 시공사례 목록</a>
        <div id="case-detail"></div>
      </div>
    </section>

    <section class="section alt">
      <div class="wrap">
        <h2>다른 시공사례</h2>
        <div class="case-cards" id="other-cases"></div>
      </div>
    </section>

    <section class="section contact cta-band">
      <div class="wrap">
        <h2>우리 현장도 이렇게 바꿔 보세요</h2>
        <p class="sub">현장을 보고 작업 범위와 견적을 알려드립니다.</p>
        <a href="index.html#contact" class="btn btn-light">무료 현장 상담 신청</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <strong data-bind="name"></strong><span id="biz-item"> · 사업자등록번호 <span data-bind="bizNumber"></span></span>
      <div class="copy">© <span id="year"></span> <span data-bind="name"></span>. All rights reserved.</div>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" hidden><img id="lightbox-img" alt="" /><p id="lightbox-cap"></p></div>

  <a class="float-call" id="float-call" aria-label="전화 상담">📞 전화 상담</a>

  <script src="assets/data.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
